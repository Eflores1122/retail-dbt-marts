name: mercadoalba
version: "1.0.0"
config-version: 2
profile: mercadoalba
require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  mx_utc_offset_hours: 6
  calendar_start: "2026-01-01"
  calendar_end: "2026-04-01"
  as_of_date: "2026-03-31"
  price_band_value_max_centavos: 5000
  price_band_mid_max_centavos: 15000
  segment_returning_max_orders: 4

models:
  mercadoalba:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  mercadoalba:
    +schema: raw
    +quote_columns: false
